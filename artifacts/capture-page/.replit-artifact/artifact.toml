kind = "web"
previewPath = "/"
title = "Capture Page"
version = "1.0.0"
id = "artifacts/capture-page"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18619

[services.development]
run = "pnpm --filter @workspace/capture-page run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/capture-page", "run", "build" ]
publicDir = "artifacts/capture-page/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18619"
BASE_PATH = "/"
